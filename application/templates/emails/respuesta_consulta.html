<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Respuesta a tu consulta - Bob el Alquilador</title>
</head>
<body style="background:#fff; margin:0; padding:0; font-family: Arial, sans-serif;">
    <div style="max-width:600px;margin:0 auto;padding:0;">
        <div style="border-bottom:2px solid #e26a2c; padding-bottom:12px; margin-bottom:24px;">
            <h2 style="color:#e26a2c; margin:0; font-size:1.6rem; font-weight:700;">Bob el Alquilador</h2>
            <div style="color:#888; font-size:1.1rem; margin-top:2px;">Respuesta a tu consulta</div>
        </div>
        <div style="font-size:1.1rem; color:#222; margin-bottom:18px;">
            Hola <b>{{ nombre }}</b>,<br><br>
            Hemos respondido tu consulta enviada a Bob el Alquilador.
        </div>
        <div style="background:#f3f3f3; border-radius:8px; padding:8px 8px; margin-bottom:8px; color:#444;">
            <div style="font-weight:600; color:#888; margin-bottom:6px;">Tu consulta:</div>
            <div style="font-size:1.08rem;">{{ consulta }}</div>
        </div>
        <div style="background:#eafbe7; border-radius:8px; padding:8px 8px; margin-bottom:8px; color:#1e5631;">
            <div style="font-weight:600; color:#1e5631; margin-bottom:6px;">Nuestra respuesta:</div>
            <div style="font-size:1.13rem;">{{ respuesta }}</div>
        </div>
        <div style="color:#888; font-size:1rem; margin-top:24px;">¡Gracias por contactarnos!<br>Bob el Alquilador</div>
    </div>
</body>
</html>
